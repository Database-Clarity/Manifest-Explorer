<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Destiny 2 Manifest Explorer</title>
    <meta
      name="description"
      content="Search Destiny 2 manifest definitions, follow hash references, and inspect changes across game updates."
    />
    <meta name="theme-color" content="#24ec54" />
    <meta name="theme-color" content="#1d2024" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#c3d3df" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://www.bungie.net" crossorigin />
    <link rel="dns-prefetch" href="https://www.bungie.net" />
    <link
      rel="alternate"
      type="application/json+oembed"
      href="https://manifest.d2clarity.com/oembed.json"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clarity" />
    <meta property="og:title" content="Destiny 2 Manifest Explorer" />
    <meta
      property="og:description"
      content="Search Destiny 2 manifest definitions, follow hash references, and inspect changes across game updates."
    />
    <meta property="og:url" content="https://manifest.d2clarity.com/" />
    <meta property="og:image" content="https://manifest.d2clarity.com/og-image.png?v=20261126-5" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Destiny 2 Manifest Explorer by Clarity" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Destiny 2 Manifest Explorer" />
    <meta
      name="twitter:description"
      content="Search Destiny 2 manifest definitions, follow hash references, and inspect changes across game updates."
    />
    <meta name="twitter:image" content="https://manifest.d2clarity.com/og-image.png?v=20261126-5" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('clarity-manifest-settings');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var state = parsed && parsed.state ? parsed.state : parsed;
          var root = document.documentElement;
          if (state.theme === 'dark' || state.theme === 'light') {
            root.setAttribute('data-theme', state.theme);
          }
          if (typeof state.uiScale === 'number' && state.uiScale >= 85 && state.uiScale <= 150) {
            root.style.fontSize = (state.uiScale / 100) * 16 + 'px';
          }
          if (state.touchSize === 'large') {
            root.setAttribute('data-touch', 'large');
          }
          if (typeof state.codeFontSize === 'number') {
            root.style.setProperty('--code-font-size', state.codeFontSize + 'px');
          }
        } catch (_e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
